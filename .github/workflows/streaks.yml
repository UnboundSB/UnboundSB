name: Auto-update Stats

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours automatically
  workflow_dispatch: # Gives you a manual "Run workflow" button in the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch Stats and Save Locally
        run: |
          mkdir -p assets
          
          # Fetch images
          curl -s -o assets/stats.svg "https://github-readme-stats.vercel.app/api?username=UnboundSB&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=00d9ff&icon_color=a855f7&text_color=c9d1d9&rank_icon=github"
          curl -s -o assets/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=UnboundSB&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=00d9ff&text_color=c9d1d9"
          curl -s -o assets/streak.svg "https://streak-stats.demolab.com/?user=UnboundSB&theme=tokyonight&hide_border=true&background=0d1117&stroke=00d9ff&ring=a855f7&fire=f72585&currStreakLabel=00d9ff&sideLabels=a855f7&sideNums=c9d1d9&dates=64748b&border_radius=12"
          curl -s -o assets/graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=UnboundSB&bg_color=0d1117&color=00d9ff&line=a855f7&point=f72585&area=true&hide_border=true&radius=12"

          # Safety Check: Don't save if the API returned an error
          if grep -qi "failed" assets/stats.svg; then
            echo "API is rate limited right now. Aborting to keep the old, working images."
            exit 0
          fi

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update github stats"
          file_pattern: "assets/*.svg"
