name: Auto-Refresh Stats
on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours automatically
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the images back to your repo
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Download Stat SVGs
        run: |
          # Main Stats
          curl "https://github-readme-stats.vercel.app/api?username=UnboundSB&show_icons=true&theme=tokyonight&hide_border=false&bg_color=0d1117&title_color=00d9ff&icon_color=a855f7&text_color=c9d1d9&border_radius=12&include_all_commits=true" -o stats.svg
          
          # Top Languages
          curl "https://github-readme-stats.vercel.app/api/top-langs/?username=UnboundSB&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=00d9ff&text_color=c9d1d9&border_radius=12&langs_count=8" -o langs.svg
          
          # Streak Stats
          curl "https://github-readme-streak-stats.herokuapp.com/?user=UnboundSB&theme=tokyonight&hide_border=true&background=0d1117&stroke=00d9ff&ring=a855f7&fire=f72585&currStreakLabel=00d9ff&sideLabels=a855f7&sideNums=c9d1d9&dates=64748b&border_radius=12" -o streak.svg
          
          # Activity Graph
          curl "https://github-readme-activity-graph.vercel.app/graph?username=UnboundSB&bg_color=0d1117&color=00d9ff&line=a855f7&point=f72585&area=true&area_color=00d9ff&hide_border=true&border_radius=12&custom_title=Siddhesh's%20Contribution%20Graph" -o activity.svg
      
      - name: Push Images to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "chore: auto-update profile stats" || exit 0
          git push
